version: 2
updates:
  # Bun workspaces (root bun.lock covers apps/* and packages/*).
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch bumps; majors still come one by one.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  # Actions are pinned by SHA; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
